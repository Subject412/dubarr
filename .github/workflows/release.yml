name: release

# Cut a release by pushing an annotated tag that matches vX.Y.Z (see
# docs/RELEASING.md). Everything is built on one pinned Ubuntu runner so the
# archives are produced from the same commit and toolchain:
#   * Go: native cross-compilation (CGO_ENABLED=0), no extra toolchain.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: build archives
    runs-on: ubuntu-22.04
    permissions:
      contents: write # softprops/action-gh-release creates the GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # The SPA is embedded by Go (backend/web), so the Vite build must run
      # before any `go build`. Vite writes into backend/web with
      # emptyOutDir=false, preserving doc.go.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend binaries
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../release-artifacts/bin
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "building dubarr ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "../release-artifacts/bin/${out}" ./cmd/dubarr
          }
          build linux amd64 dubarr-linux-amd64
          build linux arm64 dubarr-linux-arm64

      - name: Assemble archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ART="release-artifacts"
          BIN="${ART}/bin"

          make_readme() {
            local slot="$1"
            cat <<EOF
          Dubarr ${VERSION} (${slot})

          Contents
            dubarr          web UI + backend (start with: ./dubarr --data-dir ./data --listen 127.0.0.1:8080)
            LICENSE         MIT license

          The DSP engine is compiled into dubarr: this archive is a single
          binary and nothing else has to be installed beside it.

          ffmpeg, ffprobe and mkvmerge must be installed and on PATH. Verify
          with GET /api/health, which reports all three.
          Full notes: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RELEASING.md
          EOF
          }

          stage_linux() {
            local arch="$1" gosuffix="$2"
            local dir="dubarr_${VERSION}_linux_${arch}"
            mkdir -p "${ART}/${dir}"
            cp "${BIN}/dubarr-linux-${gosuffix}" "${ART}/${dir}/dubarr"
            cp LICENSE "${ART}/${dir}/LICENSE"
            make_readme "linux/${arch}" > "${ART}/${dir}/README.txt"
            chmod 0755 "${ART}/${dir}/dubarr"
            tar -C "${ART}" -czf "${ART}/${dir}.tar.gz" "${dir}"
          }

          stage_linux amd64 amd64
          stage_linux arm64 arm64

          (cd "${ART}" && sha256sum \
            "dubarr_${VERSION}_linux_amd64.tar.gz" \
            "dubarr_${VERSION}_linux_arm64.tar.gz" \
            > "dubarr_${VERSION}_checksums.txt")

          ls -l "${ART}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*_checksums.txt
