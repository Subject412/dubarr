<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dubarr</title>
    <script>
      // Resolve the stored theme before first paint so light mode never
      // flashes the dark default. Mirrored by src/lib/theme.ts.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('dubarr.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark'
          var dark = preference === 'dark'
          if (preference === 'system') {
            dark =
              typeof window.matchMedia !== 'function' ||
              window.matchMedia('(prefers-color-scheme: dark)').matches
          }
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-B-untJcs.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BKCzU3Iz.css">
  </head>

  </body>
</html>
